name: Daily check

on:
  schedule:
    # 10:30 UTC is 4:00 PM India time.
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the desk and start the check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time 90 \
              "${APP_URL}/api/daily-check")
            if [ "$code" = "202" ]; then
              exit 0
            fi
            echo "Attempt ${i} returned ${code}"
            sleep 20
          done
          echo "Daily check did not start" >&2
          exit 1
